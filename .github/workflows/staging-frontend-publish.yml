name: Publish or roll back SiteGround staging (manual only)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Staging-only action"
        required: true
        type: choice
        options: [publish, rollback]
      source_sha:
        description: "Optional for publish (auto-select latest successful build); required for rollback"
        required: false
        type: string
      build_run_id:
        description: "Optional for publish; provide with source SHA to pin a specific build"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: siteground-staging-publish
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      RELEASE_ACTION: ${{ inputs.action }}
      SITEGROUND_HOST: ${{ secrets.SITEGROUND_STAGING_SSH_HOST }}
      SITEGROUND_USER: ${{ secrets.SITEGROUND_STAGING_SSH_USER }}
      SITEGROUND_PORT: ${{ secrets.SITEGROUND_STAGING_SSH_PORT }}
      STAGING_ROOT: ${{ secrets.SITEGROUND_STAGING_PUBLIC_DIR }}
      RELEASE_ROOT: ${{ secrets.SITEGROUND_STAGING_RELEASE_DIR }}
    steps:
      - name: Validate input and publication credentials
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
          REQUESTED_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ACTION" == publish || "$RELEASE_ACTION" == rollback ]] || exit 2
          if [[ "$RELEASE_ACTION" == rollback ]]; then
            [[ "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Rollback requires the current release SHA"; exit 2; }
            [[ -z "$REQUESTED_RUN_ID" ]] || { echo "::error::Rollback must not include a build run ID"; exit 2; }
          fi
          for name in SITEGROUND_HOST SITEGROUND_USER STAGING_ROOT RELEASE_ROOT; do
            [[ -n "${!name}" ]] || { echo "::error::Missing staging deployment environment secret: $name"; exit 2; }
          done
          [[ "$STAGING_ROOT" = /* && "$RELEASE_ROOT" = /* ]] || exit 2

      - name: Check out release script
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve and validate staging build
        if: inputs.action == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          REQUESTED_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          python3 scripts/deployment/resolve-staging-build.py \
            --source-sha "$REQUESTED_SHA" --build-run-id "$REQUESTED_RUN_ID"

      - name: Obtain successful build artifact
        if: inputs.action == 'publish'
        uses: actions/download-artifact@v4
        with:
          name: dtb-staging-${{ env.RELEASE_SHA }}
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}
          path: validated-artifact

      - name: Validate build provenance and unpack safely
        if: inputs.action == 'publish'
        run: |
          set -euo pipefail
          [[ "$(cat validated-artifact/staging-source-sha.txt)" == "$RELEASE_SHA" ]] ||
            { echo "::error::Artifact source SHA does not match"; exit 2; }
          python3 - <<'PY'
          import pathlib, tarfile
          archive = pathlib.Path("validated-artifact/staging-dist.tar.gz")
          root = pathlib.Path("payload")
          root.mkdir()
          with tarfile.open(archive, "r:gz") as tar:
              names = set()
              total = 0
              for member in tar:
                  path = pathlib.PurePosixPath(member.name)
                  parts = [p for p in path.parts if p != "."]
                  if not parts and member.isdir():
                      continue
                  assert parts and ".." not in parts and not path.is_absolute(), "Unsafe archive path"
                  normalized = "/".join(parts)
                  assert normalized not in names, "Duplicate archive path"
                  names.add(normalized)
                  assert member.isfile() or member.isdir(), "Non-regular archive entry"
                  total += member.size
                  assert total <= 512 * 1024 * 1024, "Oversized archive"
              tar.extractall(root, filter="data")
          PY
          (
            cd payload
            sha256sum -c ../validated-artifact/staging-artifact-sha256.txt
          )
          for f in index.html .htaccess asset-manifest.json site.webmanifest; do
            test -s "payload/$f" || { echo "::error::Missing $f"; exit 2; }
          done
          cp validated-artifact/staging-artifact-sha256.txt payload/.dtb-file-sha256

      - name: Set rollback release identity
        if: inputs.action == 'rollback'
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: echo "RELEASE_SHA=$REQUESTED_SHA" >> "$GITHUB_ENV"

      - name: Configure staging SSH identity
        env:
          SSH_KEY: ${{ secrets.SITEGROUND_STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_KEY" ]] ||
            { echo "::error::Staging SSH key is required"; exit 2; }
          mkdir -m 700 -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_staging
          chmod 600 ~/.ssh/id_staging

      - name: Prepare private incoming release directory
        if: inputs.action == 'publish'
        run: |
          set -euo pipefail
          printf -v remote '%q ' bash -s -- prepare "$STAGING_ROOT" "$RELEASE_ROOT" "$RELEASE_SHA"
          ssh -i ~/.ssh/id_staging -p "${SITEGROUND_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SITEGROUND_USER@$SITEGROUND_HOST" "$remote" < scripts/deployment/staging-release.sh

      - name: Transfer artifact outside webroot
        if: inputs.action == 'publish'
        run: |
          set -euo pipefail
          printf -v remote_dest '%q' "$RELEASE_ROOT/incoming/$RELEASE_SHA/"
          rsync -a --no-owner --no-group --no-perms \
            -e "ssh -i $HOME/.ssh/id_staging -p ${SITEGROUND_PORT:-22} -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            payload/ "$SITEGROUND_USER@$SITEGROUND_HOST:$remote_dest"

      - name: Publish or roll back staging with lock
        run: |
          set -euo pipefail
          printf -v remote '%q ' bash -s -- "$RELEASE_ACTION" "$STAGING_ROOT" "$RELEASE_ROOT" "$RELEASE_SHA"
          ssh -i ~/.ssh/id_staging -p "${SITEGROUND_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SITEGROUND_USER@$SITEGROUND_HOST" "$remote" < scripts/deployment/staging-release.sh

      - name: Verify staging HTTP shell and noindex response
        if: inputs.action == 'publish' || inputs.action == 'rollback'
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl --fail --silent --show-error --location --max-time 30 \
            --dump-header "$headers" -o /tmp/dtb-staging.html \
            https://drywalltoolbox.com/staging/
          grep -qi '<html' /tmp/dtb-staging.html
          grep -qi 'x-robots-tag:.*noindex' "$headers" ||
            { echo "::error::Staging noindex header missing"; exit 2; }
