name: Deploy Frontend to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: siteground-staging-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate staging artifact
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      release_sha: ${{ steps.identity.outputs.release_sha }}
    steps:
      - name: Check out triggering source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Confirm staging build configuration
        run: test -s frontend/.env.staging

      - name: Build staging frontend
        working-directory: frontend
        run: npm run build:staging

      - name: Validate distribution and create checksums
        run: |
          set -euo pipefail
          root=dist-staging
          for file in index.html .htaccess asset-manifest.json site.webmanifest; do
            test -s "$root/$file" || { echo "::error::Missing or empty $file"; exit 1; }
          done
          python3 - <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path("dist-staging")
          manifest = json.loads((root / "asset-manifest.json").read_text())
          entrypoints = manifest.get("entrypoints")
          assert isinstance(entrypoints, list) and entrypoints, "Missing entrypoints"
          for uri in entrypoints:
              assert isinstance(uri, str) and uri.startswith("/staging/"), f"Incorrect staging URL: {uri}"
              assert (root / uri.removeprefix("/staging/")).is_file(), f"Missing entrypoint: {uri}"
          html = (root / "index.html").read_text()
          assert "/staging/" in html, "Missing staging base path"
          assert not re.search(r'src=["\']/assets/', html), "Root-mounted asset reference found"
          print(f"Validated {len(entrypoints)} staging entrypoints")
          PY
          (
            cd "$root"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > staging-artifact-sha256.txt

      - name: Identify and package this build
        id: identity
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "$source_sha" == "$GITHUB_SHA" ]] || { echo "::error::Build source differs from triggering commit"; exit 2; }
          release_sha="$(printf '%s:%s:%s' "$source_sha" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | sha1sum | cut -d' ' -f1)"
          mkdir payload
          cp -a dist-staging/. payload/
          cp staging-artifact-sha256.txt payload/.dtb-file-sha256
          (
            cd payload
            sha256sum -c .dtb-file-sha256 >/dev/null
          )
          tar -czf staging-payload.tar.gz -C payload .
          printf '%s\n' "$source_sha" > staging-source-sha.txt
          printf '%s\n' "$release_sha" > staging-release-sha.txt
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Upload the validated release artifact
        uses: actions/upload-artifact@v4
        with:
          name: dtb-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            staging-payload.tar.gz
            staging-artifact-sha256.txt
            staging-source-sha.txt
            staging-release-sha.txt
          if-no-files-found: error
          retention-days: 2

      - name: Summarize build
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Staging build"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Status | \`$JOB_STATUS\` |"
            echo "| Source | \`${{ steps.identity.outputs.source_sha || github.sha }}\` |"
            echo "| Artifact | \`dtb-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish validated artifact to staging
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      SITEGROUND_HOST: ${{ secrets.SITEGROUND_STAGING_SSH_HOST }}
      SITEGROUND_USER: ${{ secrets.SITEGROUND_STAGING_SSH_USER }}
      SITEGROUND_PORT: ${{ secrets.SITEGROUND_STAGING_SSH_PORT }}
      STAGING_ROOT: ${{ secrets.SITEGROUND_STAGING_PUBLIC_DIR }}
      RELEASE_ROOT: ${{ secrets.SITEGROUND_STAGING_RELEASE_DIR }}
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
      RELEASE_ACTION: publish
      BUILD_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Check out release script
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download this run's build artifact
        uses: actions/download-artifact@v4
        with:
          name: dtb-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifact

      - name: Verify artifact identity and checksums
        run: |
          set -euo pipefail
          cd release-artifact
          [[ "$(cat staging-source-sha.txt)" == "$SOURCE_SHA" && "$SOURCE_SHA" == "$GITHUB_SHA" ]] || {
            echo "::error::Artifact source does not match this workflow commit"
            exit 2
          }
          expected_release="$(printf '%s:%s:%s' "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | sha1sum | cut -d' ' -f1)"
          [[ "$(cat staging-release-sha.txt)" == "$RELEASE_SHA" && "$RELEASE_SHA" == "$expected_release" ]] || {
            echo "::error::Artifact release identity mismatch"
            exit 2
          }
          tar -tzf staging-payload.tar.gz | awk '/^\// || /(^|\/)\.\.(\/|$)/ { bad=1 } END { exit bad }' || {
            echo "::error::Unsafe path in staging artifact"
            exit 2
          }
          mkdir ../payload
          tar -xzf staging-payload.tar.gz --no-same-owner -C ../payload
          cp staging-artifact-sha256.txt ../
          cd ../payload
          sha256sum -c .dtb-file-sha256 >/dev/null

      - name: Validate staging release configuration
        run: |
          set -euo pipefail
          for name in SITEGROUND_HOST SITEGROUND_USER STAGING_ROOT RELEASE_ROOT; do
            [[ -n "${!name}" ]] || { echo "::error::Missing staging deployment setting: $name"; exit 2; }
          done
          [[ "$STAGING_ROOT" = /* && "$RELEASE_ROOT" = /* ]] || exit 2
          [[ "$SOURCE_SHA" == "$GITHUB_SHA" ]] || exit 2

      - name: Configure pinned SSH identity
        env:
          SSH_KEY: ${{ secrets.SITEGROUND_STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_KEY" ]] || { echo "::error::Staging SSH key is required"; exit 2; }
          mkdir -m 700 -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_staging"
          chmod 600 "$HOME/.ssh/id_staging"

      - name: Prepare private incoming release directory
        run: |
          set -euo pipefail
          printf -v remote '%q ' bash -s -- prepare "$STAGING_ROOT" "$RELEASE_ROOT" "$RELEASE_SHA"
          ssh -i "$HOME/.ssh/id_staging" -p "${SITEGROUND_PORT:-22}" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SITEGROUND_USER@$SITEGROUND_HOST" "$remote" < scripts/deployment/staging-release.sh

      - name: Transfer the validated artifact outside the webroot
        run: |
          set -euo pipefail
          printf -v remote_dest '%q' "$RELEASE_ROOT/incoming/$RELEASE_SHA/"
          rsync -a --no-owner --no-group --no-perms \
            -e "ssh -i $HOME/.ssh/id_staging -p ${SITEGROUND_PORT:-22} -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            payload/ "$SITEGROUND_USER@$SITEGROUND_HOST:$remote_dest"

      - name: Reject superseded push before publishing
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$latest_main" == "$SOURCE_SHA" ]] || {
            echo "::error::Skipping outdated staging publish for $SOURCE_SHA; main is $latest_main"
            exit 1
          }

      - name: Publish with server lock and rollback snapshot
        run: |
          set -euo pipefail
          printf -v remote '%q ' bash -s -- "$RELEASE_ACTION" "$STAGING_ROOT" "$RELEASE_ROOT" "$RELEASE_SHA"
          ssh -i "$HOME/.ssh/id_staging" -p "${SITEGROUND_PORT:-22}" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SITEGROUND_USER@$SITEGROUND_HOST" "$remote" < scripts/deployment/staging-release.sh

      - name: Verify published webroot hashes on SiteGround
        run: |
          set -euo pipefail
          printf -v remote '%q ' bash -c 'cd "$1" && sha256sum -c - >/dev/null' -- "$STAGING_ROOT"
          ssh -i "$HOME/.ssh/id_staging" -p "${SITEGROUND_PORT:-22}" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SITEGROUND_USER@$SITEGROUND_HOST" "$remote" < staging-artifact-sha256.txt

      - name: Verify public staging shell with bounded transport retry
        run: bash scripts/deployment/verify-staging-http.sh https://drywalltoolbox.com/staging/

      - name: Check public staging asset delivery
        id: asset_delivery
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("payload/asset-manifest.json").read_text())
          selected = {}
          for uri in manifest["entrypoints"]:
              extension = Path(uri).suffix
              if extension in {".js", ".css"} and extension not in selected:
                  selected[extension] = uri
          assert set(selected) == {".js", ".css"}, "Missing JS or CSS entrypoint"
          Path("/tmp/dtb-staging-asset-urls").write_text("\n".join(selected.values()) + "\n")
          PY
          delivery=verified
          while IFS= read -r path; do
            expected_type=javascript
            [[ "$path" == *.css ]] && expected_type=text/css
            verified=false
            last_failure=unknown
            for attempt in 1 2 3; do
              headers="$(mktemp)"
              body="$(mktemp)"
              status=000
              curl_exit=0
              status="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
                --dump-header "$headers" --output "$body" --write-out '%{http_code}' \
                "https://drywalltoolbox.com$path")" || curl_exit=$?
              if [[ "$curl_exit" -eq 0 && "$status" == 200 ]] && grep -qi "^content-type:.*$expected_type" "$headers"; then
                verified=true
                rm -f "$headers" "$body"
                break
              fi
              if [[ "$curl_exit" -ne 0 || "$status" == 000 ]]; then
                last_failure="transport error (curl exit $curl_exit, HTTP $status)"
                echo "::warning::Staging asset transport failure for $path (attempt $attempt/3: $last_failure)"
              elif [[ "$status" == 202 ]] && grep -qi '^sg-captcha:.*challenge' "$headers"; then
                last_failure="SiteGround CAPTCHA challenge (HTTP $status)"
                echo "::warning::SiteGround challenged the public asset probe for $path (attempt $attempt/3)"
              else
                echo "::error::Staging asset returned HTTP $status for $path (expected $expected_type)"
                cat "$headers"
                rm -f "$headers" "$body"
                exit 2
              fi
              rm -f "$headers" "$body"
              if [[ "$attempt" -lt 3 ]]; then sleep "$((attempt * 5))"; fi
            done
            if [[ "$verified" != true ]]; then
              if [[ "$last_failure" == "SiteGround CAPTCHA challenge (HTTP 202)" ]]; then
                delivery=unverified_bot_challenge
                echo "::warning::Public delivery remains unverified because SiteGround challenged the GitHub runner; artifact and webroot hashes were verified."
              else
                echo "::error::Public staging asset verification failed for $path: $last_failure"
                echo "delivery=failed" >> "$GITHUB_OUTPUT"
                exit 2
              fi
            fi
          done < /tmp/dtb-staging-asset-urls
          echo "delivery=$delivery" >> "$GITHUB_OUTPUT"

      - name: Summarize staging deployment
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## SiteGround staging deployment"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Status | \`$JOB_STATUS\` |"
            echo "| Source | \`$SOURCE_SHA\` |"
            echo "| Release | \`$RELEASE_SHA\` |"
            echo "| Public asset delivery | \`${{ steps.asset_delivery.outputs.delivery || 'not_checked' }}\` |"
            echo "| Build artifact | \`dtb-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\` |"
            echo "| Staging URL | https://drywalltoolbox.com/staging/ |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/id_staging"
