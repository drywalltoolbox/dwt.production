name: Deploy Latest Frontend to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: siteground-staging-publish
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: staging
    env:
      RELEASE_ACTION: publish
      SITEGROUND_HOST: ${{ secrets.SITEGROUND_STAGING_SSH_HOST }}
      SITEGROUND_USER: ${{ secrets.SITEGROUND_STAGING_SSH_USER }}
      SITEGROUND_PORT: ${{ secrets.SITEGROUND_STAGING_SSH_PORT }}
      STAGING_ROOT: ${{ secrets.SITEGROUND_STAGING_PUBLIC_DIR }}
      RELEASE_ROOT: ${{ secrets.SITEGROUND_STAGING_RELEASE_DIR }}
    steps:
      - name: Validate staging deployment configuration
        run: |
          set -euo pipefail
          for name in SITEGROUND_HOST SITEGROUND_USER STAGING_ROOT RELEASE_ROOT; do
            [[ -n "${!name}" ]] || { echo "::error::Missing staging deployment environment secret: $name"; exit 2; }
          done
          [[ "$STAGING_ROOT" = /* && "$RELEASE_ROOT" = /* ]] || exit 2

      - name: Check out current frontend source and release script
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Assert staging configuration exists
        run: |
          set -euo pipefail
          test -s frontend/.env.staging || { echo "::error::frontend/.env.staging missing or empty"; exit 2; }

      - name: Build staging frontend using .env.staging
        working-directory: frontend
        run: npm run build:staging

      - name: Validate staging distribution and inventory
        run: |
          set -euo pipefail
          root=dist-staging
          for f in index.html .htaccess asset-manifest.json site.webmanifest; do
            test -s "$root/$f" || { echo "::error::Missing/empty $f"; exit 1; }
          done
          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path("dist-staging")
          manifest = json.loads((root / "asset-manifest.json").read_text())
          entry = manifest.get("entrypoints")
          assert isinstance(entry, list) and entry, "Missing entrypoints"
          for uri in entry:
              assert isinstance(uri, str) and uri.startswith("/staging/"), f"Incorrect staging URL: {uri}"
              target = root / uri.removeprefix("/staging/")
              assert target.is_file(), f"Missing entrypoint: {uri}"
          html = (root / "index.html").read_text()
          assert "/staging/" in html, "Missing staging base path"
          assert not re.search(r'src=["\']/assets/', html), "Root-mounted asset reference found"
          print(f"Validated {len(entry)} staging entrypoints")
          PY
          (
            cd "$root"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > staging-artifact-sha256.txt

      - name: Prepare build payload and unique release identity
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]] || exit 2
          [[ "$source_sha" == "$GITHUB_SHA" ]] || { echo "::error::Unexpected checkout SHA"; exit 2; }
          release_sha="$(printf '%s:%s:%s' "$source_sha" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | sha1sum | cut -d' ' -f1)"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"
          echo "BUILD_RUN_ID=$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          mkdir -p payload
          cp -a dist-staging/. payload/
          cp staging-artifact-sha256.txt payload/.dtb-file-sha256
          (
            cd payload
            sha256sum -c .dtb-file-sha256 >/dev/null
          )
          echo "Built staging commit $source_sha as release $release_sha"

      - name: Test staging release and rollback locally
        run: bash scripts/deployment/tests/test_staging_release.sh

      - name: Configure staging SSH identity
        env:
          SSH_KEY: ${{ secrets.SITEGROUND_STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_KEY" ]] ||
            { echo "::error::Staging SSH key is required"; exit 2; }
          mkdir -m 700 -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_staging
          chmod 600 ~/.ssh/id_staging

      - name: Prepare private incoming release directory
        run: |
          set -euo pipefail
          printf -v remote '%q ' bash -s -- prepare "$STAGING_ROOT" "$RELEASE_ROOT" "$RELEASE_SHA"
          ssh -i ~/.ssh/id_staging -p "${SITEGROUND_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SITEGROUND_USER@$SITEGROUND_HOST" "$remote" < scripts/deployment/staging-release.sh

      - name: Transfer current staging build outside webroot
        run: |
          set -euo pipefail
          printf -v remote_dest '%q' "$RELEASE_ROOT/incoming/$RELEASE_SHA/"
          rsync -a --no-owner --no-group --no-perms \
            -e "ssh -i $HOME/.ssh/id_staging -p ${SITEGROUND_PORT:-22} -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            payload/ "$SITEGROUND_USER@$SITEGROUND_HOST:$remote_dest"

      - name: Reject superseded push before publishing
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          latest_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$latest_main" == "$GITHUB_SHA" ]] || {
            echo "::error::Skipping outdated staging publish for $GITHUB_SHA; main is $latest_main"
            exit 1
          }

      - name: Publish staging with lock
        run: |
          set -euo pipefail
          printf -v remote '%q ' bash -s -- "$RELEASE_ACTION" "$STAGING_ROOT" "$RELEASE_ROOT" "$RELEASE_SHA"
          ssh -i ~/.ssh/id_staging -p "${SITEGROUND_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SITEGROUND_USER@$SITEGROUND_HOST" "$remote" < scripts/deployment/staging-release.sh

      - name: Verify staging HTTP shell and noindex response
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl --fail --silent --show-error --location --max-time 30 \
            --dump-header "$headers" -o /tmp/dtb-staging.html \
            https://drywalltoolbox.com/staging/
          grep -qi '<html' /tmp/dtb-staging.html
          grep -qi 'x-robots-tag:.*noindex' "$headers" ||
            { echo "::error::Staging noindex header missing"; exit 2; }

      - name: Verify staging public asset responses
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("dist-staging/asset-manifest.json").read_text())
          entry = manifest["entrypoints"]
          extensions = {".js": "javascript", ".css": "text/css"}
          selected = {}
          for uri in entry:
              ext = Path(uri).suffix
              if ext in extensions and ext not in selected:
                  selected[ext] = uri
          assert set(selected) == set(extensions), "Missing JS or CSS entrypoint"
          Path("/tmp/dtb-staging-asset-urls").write_text("\n".join(selected.values()) + "\n")
          PY
          while IFS= read -r path; do
            expected_type=javascript
            [[ "$path" == *.css ]] && expected_type=text/css
            verified=false
            last_failure=unknown
            for attempt in 1 2 3; do
              headers="$(mktemp)"
              body="$(mktemp)"
              # Curl exit status distinguishes transport failures from HTTP responses.
              # A TLS handshake failure has no HTTP status and merits a bounded retry.
              status=000
              curl_exit=0
              status="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
                --dump-header "$headers" --output "$body" \
                --write-out '%{http_code}' "https://drywalltoolbox.com$path")" || curl_exit=$?
              if [[ "$curl_exit" -eq 0 && "$status" == 200 ]] && grep -qi "^content-type:.*$expected_type" "$headers"; then
                verified=true
                rm -f "$headers" "$body"
                break
              fi
              if [[ "$curl_exit" -ne 0 || "$status" == 000 ]]; then
                last_failure="transport error (curl exit $curl_exit, HTTP $status)"
                echo "::warning::Transient staging asset transport failure for $path (attempt $attempt/3: $last_failure)"
              elif grep -qi '^sg-captcha:.*challenge' "$headers"; then
                last_failure="SiteGround CAPTCHA challenge (HTTP $status)"
                echo "::warning::SiteGround challenged asset verification for $path (attempt $attempt/3)"
              else
                echo "::error::Staging asset verification returned HTTP $status for $path (expected $expected_type)"
                cat "$headers"
                rm -f "$headers" "$body"
                exit 2
              fi
              rm -f "$headers" "$body"
              if [[ "$attempt" -lt 3 ]]; then sleep "$((attempt * 5))"; fi
            done
            if [[ "$verified" != true ]]; then
              echo "::error::Public staging asset verification failed after three attempts for $path: $last_failure. Published files are not proof of public delivery. Investigate SiteGround TLS/network/bot protection; do not disable security globally."
              exit 2
            fi
          done < /tmp/dtb-staging-asset-urls

      - name: Summarize staging deployment outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## SiteGround staging deployment"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Action | \`$RELEASE_ACTION\` |"
            echo "| Job status | \`$JOB_STATUS\` |"
            echo "| Rebuilt from source | \`${SOURCE_SHA:-not resolved}\` |"
            echo "| Release identity | \`${RELEASE_SHA:-not resolved}\` |"
            echo "| Workflow build run | \`${BUILD_RUN_ID:-not resolved}\` |"
            echo "| Workflow run | [View run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) |"
            echo "| Staging URL | https://drywalltoolbox.com/staging/ |"
          } >> "$GITHUB_STEP_SUMMARY"
