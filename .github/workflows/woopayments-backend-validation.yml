name: WooPayments backend change validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'drywalltoolbox/wp/wp-content/mu-plugins/dtb-commerce/**'
      - 'drywalltoolbox/wp/wp-content/mu-plugins/dtb-order-platform/**'
      - 'drywalltoolbox/wp/wp-content/mu-plugins/dtb-integrations/OperationalPipeline/**'
      - 'frontend/src/api/checkoutCapabilities.js'
      - 'scripts/launch-readiness/tests/native_checkout_mount_contract.php'
      - 'scripts/launch-readiness/tests/test_routing_contract.py'
      - 'docs/checkout/**'
      - 'drywalltoolbox/wp/wp-content/mu-plugins/dtb-integrations/Veeqo/VeeqoShippingService.php'
      - 'scripts/launch-readiness/tests/veeqo_shipping_contract.php'
      - '.github/workflows/woopayments-backend-validation.yml'

permissions:
  contents: read

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint changed PHP files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            [[ -f "$path" ]] || continue
            php -l "$path"
          done < <(git diff --name-only --diff-filter=ACMRT "$BASE_SHA"...HEAD | grep -E '\.php$' || true)
      - name: Verify Veeqo shipping carton and carrier-rate contract
        run: php scripts/launch-readiness/tests/veeqo_shipping_contract.php
      - name: Run native checkout routing contract
        run: python3 scripts/launch-readiness/tests/test_routing_contract.py
      - name: Run native checkout mount behavior
        run: php scripts/launch-readiness/tests/native_checkout_mount_contract.php
