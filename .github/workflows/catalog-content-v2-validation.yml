name: Catalog content v2 validation
on:
  push:
    branches:
      - 'feat/catalog-content-schema-v2-foundation'
  pull_request:
    paths:
      - 'products/launch/official/dtb_official_catalog.csv'
      - 'scripts/catalog/**'
      - 'drywalltoolbox/wp/wp-content/mu-plugins/dtb-catalog-platform/**'
      - '.github/workflows/catalog-content-v2-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PHP syntax
        run: |
          php -l drywalltoolbox/wp/wp-content/mu-plugins/dtb-catalog-platform/Application/CatalogContentCsv.php
          php -l drywalltoolbox/wp/wp-content/mu-plugins/dtb-catalog-platform/Domain/ProductMeta.php
          php -l drywalltoolbox/wp/wp-content/mu-plugins/dtb-catalog-platform/Services/CatalogProductNormalizer.php
          php -l drywalltoolbox/wp/wp-content/mu-plugins/dtb-catalog-platform/bootstrap.php
      - name: Features CSV importer regression
        run: php scripts/catalog/tests/catalog_content_csv_contract.php
      - name: Canonical catalog structural validation
        run: |
          PYTHONPATH=scripts/catalog python -c "from pathlib import Path; from official_catalog_schema import validate_catalog; root=Path('products/launch/official'); print(validate_catalog(root/'dtb_official_catalog.csv', root/'dtb_official_catalog.include-gaps.json'))"
      # The separate existing taxonomy audit currently reports 406 unrelated
      # pre-existing product classification defects. Keep that workstream distinct.
      - name: V2 migration regression
        run: python -m unittest discover -s scripts/catalog/tests -p 'test_content_schema_v2.py' -v
