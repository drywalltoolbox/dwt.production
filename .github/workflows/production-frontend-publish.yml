name: Publish React Storefront to Production Root

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: siteground-production-frontend
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify root-mounted storefront
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - name: Validate production release intent
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Production storefront releases must run from main"; exit 2; }

      - name: Check out triggering main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record immutable build identity
        id: identity
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "$source_sha" == "$GITHUB_SHA" ]] || { echo "::error::Source SHA differs from dispatch commit"; exit 2; }
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build production root frontend
        working-directory: frontend
        run: npm run build:production

      - name: Validate production artifact and create checksums
        run: |
          set -euo pipefail
          root=dist
          for file in index.html .htaccess asset-manifest.json robots.txt site.webmanifest; do
            test -s "$root/$file" || { echo "::error::Missing or empty $file"; exit 2; }
          done
          test ! -e "$root/storefront.html" || { echo "::error::Duplicate storefront shell emitted"; exit 2; }
          test ! -e "$root/logos" || { echo "::error::Shared root logos must not be in the frontend payload"; exit 2; }
          test ! -e "$root/assets/email" || { echo "::error::Shared email assets must not be in the frontend payload"; exit 2; }
          python3 - <<'PY'
          import json
          import pathlib

          root = pathlib.Path("dist")
          brands = root / "brands"
          brand_files = sorted(path for path in brands.rglob("*") if path.is_file())
          assert brand_files, "No schematic source data was included"
          for path in brand_files:
              assert path.name.startswith("schematic_data") and path.suffix.lower() == ".json", f"Unexpected file under brands: {path}"
              assert path.name not in {"schematic_data.schema.json", "schematic_data_template.json"}, f"Authoring/schema file must not be published: {path}"
              json.loads(path.read_text())
          manifest = json.loads((root / "asset-manifest.json").read_text())
          entrypoints = manifest.get("entrypoints")
          assert isinstance(entrypoints, list) and entrypoints, "Missing asset entrypoints"
          for uri in entrypoints:
              assert isinstance(uri, str) and uri.startswith("/assets/"), f"Not a root asset URL: {uri}"
              assert (root / uri.lstrip("/")).is_file(), f"Missing entrypoint: {uri}"
          html = (root / "index.html").read_text()
          rules = (root / ".htaccess").read_text()
          assert "/staging/" not in html, "Staging asset prefix found in production HTML"
          assert "RewriteRule ^$ index.html [L]" in rules, "Root homepage does not resolve to index.html"
          assert "RewriteRule ^ index.html [QSA,L]" in rules, "SPA fallback missing"
          assert "payment_intent=pi_" in rules, "WooPayments callback route missing"
          assert 'X-Robots-Tag "noindex, nofollow"' not in rules, "Production root is marked noindex"
          print(f"Validated {len(entrypoints)} root-mounted entrypoints")
          PY
          (
            cd "$root"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > production-artifact-sha256.txt
          cp production-artifact-sha256.txt "$root/.dtb-file-sha256"
          tar -czf production-frontend-payload.tar.gz -C "$root" .

      - name: Upload immutable production artifact
        uses: actions/upload-artifact@v4
        with:
          name: dtb-production-frontend-${{ steps.identity.outputs.source_sha }}
          path: |
            production-frontend-payload.tar.gz
            production-artifact-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Summarize production build
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Production storefront build"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Status | \`$JOB_STATUS\` |"
            echo "| Source | \`${{ steps.identity.outputs.source_sha || github.sha }}\` |"
            echo "| Artifact | \`dtb-production-frontend-${{ steps.identity.outputs.source_sha || github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Snapshot and publish public_html root
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: siteground-production
      url: https://drywalltoolbox.com
    env:
      SITEGROUND_HOST: ${{ secrets.SITEGROUND_SSH_HOST }}
      SITEGROUND_USER: ${{ secrets.SITEGROUND_SSH_USER }}
      SITEGROUND_PORT: ${{ secrets.SITEGROUND_SSH_PORT }}
      SITEGROUND_KEY: ${{ secrets.SITEGROUND_PRODUCTION_SSH_PRIVATE_KEY }}
      SITEGROUND_KEY_PASSPHRASE: ${{ secrets.SITEGROUND_PRODUCTION_SSH_KEY_PASSPHRASE }}
      SITEGROUND_KEY_FINGERPRINT: ${{ vars.SITEGROUND_PRODUCTION_SSH_KEY_FINGERPRINT }}
      PUBLIC_HTML_ROOT: ${{ vars.SITEGROUND_PRODUCTION_PUBLIC_HTML_ROOT }}
      PRIVATE_RELEASE_ROOT: ${{ vars.SITEGROUND_PRODUCTION_FRONTEND_RELEASE_ROOT }}
      UPDRAFT_BACKUP_VERIFIED: ${{ vars.SITEGROUND_PRODUCTION_UPDRAFT_BACKUP_VERIFIED }}
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
    steps:
      - name: Check out release tooling at the built source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          persist-credentials: false

      - name: Download this run's production artifact
        uses: actions/download-artifact@v4
        with:
          name: dtb-production-frontend-${{ needs.build.outputs.source_sha }}
          path: release-artifact

      - name: Verify artifact and unpack safe payload
        run: |
          set -euo pipefail
          cd release-artifact
          test -s production-frontend-payload.tar.gz
          test -s production-artifact-sha256.txt
          mkdir ../payload
          tar -tzf production-frontend-payload.tar.gz | awk '/^\// || /(^|\/)\.\.(\/|$)/ { bad=1 } END { exit bad }' || {
            echo "::error::Unsafe path in frontend release artifact"; exit 2;
          }
          tar -xzf production-frontend-payload.tar.gz --no-same-owner -C ../payload
          cmp production-artifact-sha256.txt ../payload/.dtb-file-sha256
          (cd ../payload && sha256sum -c .dtb-file-sha256 >/dev/null)

      - name: Validate production SiteGround settings
        run: |
          set -euo pipefail
          for name in SITEGROUND_HOST SITEGROUND_USER SITEGROUND_KEY SITEGROUND_KEY_PASSPHRASE SITEGROUND_KEY_FINGERPRINT PUBLIC_HTML_ROOT PRIVATE_RELEASE_ROOT SOURCE_SHA; do
            [[ -n "${!name}" ]] || { echo "::error::Missing production frontend setting: $name"; exit 2; }
          done
          [[ "$UPDRAFT_BACKUP_VERIFIED" == "true" ]] || { echo "::error::Mark the completed Updraft full-site backup in the production environment before publishing"; exit 2; }
          [[ "$SITEGROUND_PORT" =~ ^[0-9]+$ ]] || { echo "::error::Invalid SiteGround SSH port"; exit 2; }
          [[ "$PUBLIC_HTML_ROOT" == */public_html ]] || { echo "::error::Production target must end in /public_html"; exit 2; }
          [[ "$PRIVATE_RELEASE_ROOT" = /* && "$PRIVATE_RELEASE_ROOT" != "$PUBLIC_HTML_ROOT" && "$PRIVATE_RELEASE_ROOT" != "$PUBLIC_HTML_ROOT/"* ]] || {
            echo "::error::Release state must live outside public_html"; exit 2;
          }
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$SOURCE_SHA" == "$GITHUB_SHA" ]] || exit 2

      - name: Reject superseded main commit before remote mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$latest_main" == "$SOURCE_SHA" ]] || {
            echo "::error::Skipping superseded production publish for $SOURCE_SHA; main is $latest_main"
            exit 1
          }

      - name: Configure pinned SiteGround SSH access
        run: |
          set -euo pipefail
          mkdir -m 700 -p "$HOME/.ssh"
          printf '%s\n' "$SITEGROUND_KEY" > "$HOME/.ssh/siteground_frontend"
          chmod 600 "$HOME/.ssh/siteground_frontend"
          [[ -n "$SITEGROUND_KEY_PASSPHRASE" ]] || { echo "::error::Production SSH key passphrase is required"; exit 2; }
          ssh-keygen -p -P "$SITEGROUND_KEY_PASSPHRASE" -N "" -f "$HOME/.ssh/siteground_frontend" >/dev/null
          actual_fingerprint="$(ssh-keygen -y -P "" -f "$HOME/.ssh/siteground_frontend" | ssh-keygen -lf - | awk '{print $2}')"
          [[ "$actual_fingerprint" == "$SITEGROUND_KEY_FINGERPRINT" ]] || { echo "::error::Production SSH key fingerprint mismatch"; exit 2; }
          ssh-keygen -y -P "" -f "$HOME/.ssh/siteground_frontend" >/dev/null

      - name: Prepare private incoming release directory
        run: |
          set -euo pipefail
          printf -v remote '%q ' bash -s -- prepare "$PUBLIC_HTML_ROOT" "$PRIVATE_RELEASE_ROOT" "$SOURCE_SHA"
          ssh -i "$HOME/.ssh/siteground_frontend" -p "$SITEGROUND_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SITEGROUND_USER@$SITEGROUND_HOST" "$remote" < scripts/deployment/production-frontend-release.sh

      - name: Transfer verified artifact outside the webroot
        run: |
          set -euo pipefail
          printf -v remote_dest '%q' "$PRIVATE_RELEASE_ROOT/incoming/$SOURCE_SHA/"
          rsync -a --no-owner --no-group --no-perms \
            -e "ssh -i $HOME/.ssh/siteground_frontend -p $SITEGROUND_PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            payload/ "$SITEGROUND_USER@$SITEGROUND_HOST:$remote_dest"

      - name: Publish under lock with managed-file rollback snapshot
        id: publish_release
        run: |
          set -euo pipefail
          printf -v remote '%q ' bash -s -- publish "$PUBLIC_HTML_ROOT" "$PRIVATE_RELEASE_ROOT" "$SOURCE_SHA"
          ssh -i "$HOME/.ssh/siteground_frontend" -p "$SITEGROUND_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SITEGROUND_USER@$SITEGROUND_HOST" "$remote" < scripts/deployment/production-frontend-release.sh

      - name: Verify deployed hashes and public root
        run: |
          set -euo pipefail
          printf -v remote '%q ' bash -s -- verify "$PUBLIC_HTML_ROOT" "$PRIVATE_RELEASE_ROOT" "$SOURCE_SHA"
          ssh -i "$HOME/.ssh/siteground_frontend" -p "$SITEGROUND_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SITEGROUND_USER@$SITEGROUND_HOST" "$remote" < scripts/deployment/production-frontend-release.sh
          curl --fail --silent --show-error --max-time 30 https://drywalltoolbox.com/ -o live-index.html
          cmp payload/index.html live-index.html
          for uri in $(python3 -c 'import json; print(" ".join(json.load(open("payload/asset-manifest.json"))["entrypoints"]))'); do
            curl --fail --silent --show-error --head --max-time 30 "https://drywalltoolbox.com$uri" >/dev/null
          done
          curl --fail --silent --show-error --head --max-time 30 https://drywalltoolbox.com/wp-json/ >/dev/null
          curl --fail --silent --show-error --head --max-time 30 https://drywalltoolbox.com/checkout/ >/dev/null

      - name: Summarize production deployment
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Production storefront deployment"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Status | \`$JOB_STATUS\` |"
            echo "| Source | \`$SOURCE_SHA\` |"
            echo "| Target | \`/public_html\` |"
            echo "| Publish step | \`${{ steps.publish_release.outcome || 'not_checked' }}\` |"
            echo "| URL | https://drywalltoolbox.com/ |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/siteground_frontend"
