name: Frontend pull request validation

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-pr-validation.yml'

permissions:
  contents: read

concurrency:
  group: frontend-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out pull request commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Run frontend contract regression suites
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: node --test tests/*.test.mjs tests/calculators/calculators.test.mjs

      - name: Build staging frontend without deployment
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run build:staging
