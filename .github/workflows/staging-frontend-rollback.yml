name: Rollback Staging to Previous Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siteground-staging-publish
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      SITEGROUND_HOST: ${{ secrets.SITEGROUND_STAGING_SSH_HOST }}
      SITEGROUND_USER: ${{ secrets.SITEGROUND_STAGING_SSH_USER }}
      SITEGROUND_PORT: ${{ secrets.SITEGROUND_STAGING_SSH_PORT }}
      SITEGROUND_KNOWN_HOSTS: ${{ secrets.SITEGROUND_STAGING_SSH_KNOWN_HOSTS }}
      STAGING_ROOT: ${{ secrets.SITEGROUND_STAGING_PUBLIC_DIR }}
      RELEASE_ROOT: ${{ secrets.SITEGROUND_STAGING_RELEASE_DIR }}
    steps:
      - name: Validate staging rollback configuration
        run: |
          set -euo pipefail
          for name in SITEGROUND_HOST SITEGROUND_USER STAGING_ROOT RELEASE_ROOT; do
            [[ -n "${!name}" ]] || { echo "::error::Missing staging environment secret: $name"; exit 2; }
          done
          [[ "$STAGING_ROOT" = /* && "$RELEASE_ROOT" = /* ]] || exit 2

      - name: Check out release script
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure staging SSH identity
        env:
          SSH_KEY: ${{ secrets.SITEGROUND_STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_KEY" ]] || { echo "::error::Staging SSH key is required"; exit 2; }
          [[ -n "$SITEGROUND_KNOWN_HOSTS" ]] || { echo "::error::Pinned SiteGround host key is required"; exit 2; }
          mkdir -m 700 -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_staging"
          printf '%s\n' "$SITEGROUND_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_staging" "$HOME/.ssh/known_hosts"
          known_host="$SITEGROUND_HOST"
          if [[ -n "$SITEGROUND_PORT" && "$SITEGROUND_PORT" != 22 ]]; then
            known_host="[$SITEGROUND_HOST]:$SITEGROUND_PORT"
          fi
          ssh-keygen -F "$known_host" -f "$HOME/.ssh/known_hosts" >/dev/null || {
            echo "::error::Pinned SiteGround host key is missing for SITEGROUND_HOST"
            exit 2
          }

      - name: Roll back the current staging release under lock
        run: |
          set -euo pipefail
          printf -v remote '%q ' bash -s -- rollback "$STAGING_ROOT" "$RELEASE_ROOT" auto
          ssh -i "$HOME/.ssh/id_staging" -p "${SITEGROUND_PORT:-22}" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SITEGROUND_USER@$SITEGROUND_HOST" "$remote" < scripts/deployment/staging-release.sh

      - name: Verify staging HTTP shell and noindex response
        run: bash scripts/deployment/verify-staging-http.sh https://drywalltoolbox.com/staging/

      - name: Summarize rollback result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## SiteGround staging rollback"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Action | rollback previous release |"
            echo "| Job status | \`$JOB_STATUS\` |"
            echo "| Workflow run | [View run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) |"
            echo "| Staging URL | https://drywalltoolbox.com/staging/ |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/id_staging" "$HOME/.ssh/known_hosts"
