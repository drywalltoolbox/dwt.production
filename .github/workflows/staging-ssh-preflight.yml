name: Verify SiteGround staging SSH (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siteground-staging-ssh-preflight
  cancel-in-progress: false

jobs:
  verify:
    name: Authenticate and verify staging directory access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    env:
      SITEGROUND_HOST: ${{ secrets.SITEGROUND_STAGING_SSH_HOST }}
      SITEGROUND_USER: ${{ secrets.SITEGROUND_STAGING_SSH_USER }}
      SITEGROUND_PORT: ${{ secrets.SITEGROUND_STAGING_SSH_PORT }}
      STAGING_ROOT: ${{ secrets.SITEGROUND_STAGING_PUBLIC_DIR }}
      RELEASE_ROOT: ${{ secrets.SITEGROUND_STAGING_RELEASE_DIR }}
    steps:
      - name: Validate required staging secrets
        env:
          SSH_KEY: ${{ secrets.SITEGROUND_STAGING_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SITEGROUND_HOST SITEGROUND_USER SITEGROUND_PORT STAGING_ROOT RELEASE_ROOT SSH_KEY; do
            [[ -n "${!name}" ]] || { echo "::error::Missing required staging environment secret: $name"; exit 2; }
          done
          [[ "$SITEGROUND_PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$SITEGROUND_PORT >= 1 && 10#$SITEGROUND_PORT <= 65535 )) ||
            { echo "::error::Invalid SSH port"; exit 2; }
          [[ "$STAGING_ROOT" = /* && "$RELEASE_ROOT" = /* ]] ||
            { echo "::error::Staging paths must be absolute"; exit 2; }
          [[ "$STAGING_ROOT" != "$RELEASE_ROOT" ]] ||
            { echo "::error::Staging and release directories must be different"; exit 2; }
          mkdir -m 700 -p "$HOME/.ssh"
          umask 077
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_staging"
          chmod 600 "$HOME/.ssh/id_staging"
          ssh-keygen -y -P '' -f "$HOME/.ssh/id_staging" >/dev/null ||
            { echo "::error::SSH identity cannot be unlocked noninteractively"; exit 2; }

      - name: Verify SSH and directory access without mutations
        shell: bash
        run: |
          set -euo pipefail
          printf -v remote '%q ' bash -s -- "$STAGING_ROOT" "$RELEASE_ROOT"
          ssh -i "$HOME/.ssh/id_staging" \
            -p "$SITEGROUND_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$SITEGROUND_USER@$SITEGROUND_HOST" "$remote" <<'REMOTE'
          set -euo pipefail
          staging="$1"
          releases="$2"
          [[ -d "$staging" && ! -L "$staging" && -r "$staging" && -w "$staging" && -x "$staging" ]] ||
            { echo "Staging directory is missing, linked, or inaccessible"; exit 3; }
          [[ -d "$releases" && ! -L "$releases" && -r "$releases" && -w "$releases" && -x "$releases" ]] ||
            { echo "Private release directory is missing, linked, or inaccessible"; exit 3; }
          staging_real="$(realpath -- "$staging")"
          releases_real="$(realpath -- "$releases")"
          [[ "${staging_real##*/}" == staging ]] ||
            { echo "Unexpected staging directory name"; exit 3; }
          case "$staging_real" in
            */public_html/staging) ;;
            *) echo "Staging target is not under public_html/staging"; exit 3 ;;
          esac
          case "$releases_real/" in
            */public_html/*) echo "Private releases must be outside public_html"; exit 3 ;;
          esac
          echo "SSH authentication and staging directory access verified."
          REMOTE

      - name: Remove temporary SSH identity
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_staging"
