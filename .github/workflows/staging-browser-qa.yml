name: Staging browser QA

on:
  push:
    branches: [test/staging-browser-qa]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run read-only staging journey
        id: qa
        continue-on-error: true
        run: |
          mkdir -p artifacts/staging-qa
          cat > staging-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const base = 'https://drywalltoolbox.com/staging';
          const out = 'artifacts/staging-qa';
          const report = { startedAt: new Date().toISOString(), viewportRuns: [], consoleErrors: [], failedRequests: [], badResponses: [], status: 'running' };
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
          const page = await context.newPage();
          page.on('console', msg => { if (msg.type() === 'error') report.consoleErrors.push({ text: msg.text(), url: msg.location()?.url || '' }); });
          page.on('pageerror', error => report.consoleErrors.push({ text: error.message, stack: error.stack || '' }));
          page.on('requestfailed', request => report.failedRequests.push({ url: request.url(), error: request.failure()?.errorText || '' }));
          page.on('response', response => { if (response.status() >= 400) report.badResponses.push({ status: response.status(), url: response.url() }); });

          const challenge = async () => /robot challenge|verify (that )?you('re| are) human|checking your browser|unusual traffic|captcha/i.test(await page.locator('body').innerText().catch(() => ''));
          const snap = async name => page.screenshot({ path: `${out}/${name}.png`, fullPage: true });
          const bodyText = async () => page.locator('body').innerText().catch(() => '');

          try {
            const response = await page.goto(base + '/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(5000);
            await snap('desktop-1440-home');
            if (await challenge()) {
              report.status = 'blocked_by_robot_challenge';
              report.challengeEvidence = (await bodyText()).slice(0, 1200);
              console.log('DTB_QA_SUMMARY=' + JSON.stringify(report));
              await fs.writeFile(out + '/summary.json', JSON.stringify(report, null, 2));
              process.exitCode = 0;
            } else {
              report.home = { status: response?.status() ?? null, title: await page.title(), url: page.url(), text: (await bodyText()).slice(0, 1800) };
              report.viewportRuns.push({ width: 1440, height: 1000, page: 'home' });

              await page.getByRole('link', { name: 'Shop Products' }).first().click();
              await page.waitForURL(/\/staging\/(?:all-products|products)/, { timeout: 30000 });
              await page.waitForTimeout(4000);
              await snap('desktop-1440-products');
              report.products = { title: await page.title(), url: page.url(), text: (await bodyText()).slice(0, 2400) };
              report.viewportRuns.push({ width: 1440, height: 1000, page: 'products' });

              const quickView = page.getByRole('button', { name: /View product details for Angle Head Adapter/i });
              if (await quickView.count()) {
                await quickView.first().click();
                await page.getByRole('button', { name: /Add to Cart/i }).waitFor({ state: 'visible', timeout: 15000 });
                await snap('desktop-1440-product-detail');
                report.productDetail = { mode: 'quick-view', text: (await bodyText()).slice(-1600) };
                await page.getByRole('button', { name: /Add to Cart/i }).click();
                await page.waitForTimeout(1800);
                report.addToCart = { observed: true, text: (await bodyText()).slice(-1000) };
              } else {
                report.productDetail = { mode: 'not-found', reason: 'Angle Head Adapter quick-view control not present' };
              }

              await page.goto(base + '/cart/', { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(2500);
              await snap('desktop-1440-cart');
              const cartText = await bodyText();
              report.cart = { title: await page.title(), url: page.url(), containsAngleHeadAdapter: cartText.includes('Angle Head Adapter'), text: cartText.slice(-2200) };
              report.viewportRuns.push({ width: 1440, height: 1000, page: 'cart' });

              const checkoutCta = page.getByRole('link', { name: /Continue to secure checkout/i });
              if (await checkoutCta.count()) {
                await checkoutCta.first().click();
                await page.waitForLoadState('domcontentloaded', { timeout: 30000 }).catch(() => {});
              } else {
                await page.goto(base + '/checkout/', { waitUntil: 'domcontentloaded', timeout: 60000 });
              }
              await page.waitForTimeout(2500);
              await snap('desktop-1440-checkout');
              const checkoutText = await bodyText();
              report.checkout = { title: await page.title(), url: page.url(), hasUnavailable: /temporarily unavailable|page not found/i.test(checkoutText), hasNativeFields: /billing|shipping|place order/i.test(checkoutText), text: checkoutText.slice(-2200) };
              report.viewportRuns.push({ width: 1440, height: 1000, page: 'checkout' });

              for (const [width, height, label] of [[768, 1024, 'tablet-768'], [390, 844, 'mobile-390']]) {
                await page.setViewportSize({ width, height });
                await page.goto(base + '/cart/', { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForTimeout(1200);
                await snap(label + '-cart');
                report.viewportRuns.push({ width, height, page: 'cart' });
                await page.goto(base + '/checkout/', { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForTimeout(1500);
                await snap(label + '-checkout');
                report.viewportRuns.push({ width, height, page: 'checkout' });
                report[`checkout_${width}`] = { title: await page.title(), url: page.url(), text: (await bodyText()).slice(-1200) };
              }

              report.status = 'completed';
              console.log('DTB_QA_SUMMARY=' + JSON.stringify(report));
              await fs.writeFile(out + '/summary.json', JSON.stringify(report, null, 2));
              if (!report.cart?.containsAngleHeadAdapter || report.checkout?.hasUnavailable) process.exitCode = 1;
            }
          } catch (error) {
            report.status = 'test_error';
            report.error = error.stack || String(error);
            await page.screenshot({ path: out + '/failure.png', fullPage: true }).catch(() => {});
            console.log('DTB_QA_SUMMARY=' + JSON.stringify(report));
              await fs.writeFile(out + '/summary.json', JSON.stringify(report, null, 2));
            process.exitCode = 1;
          } finally {
            await browser.close();
          }
          JS
          node staging-qa.mjs

      - name: Upload browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-browser-qa
          path: artifacts/staging-qa/
          if-no-files-found: warn

      - name: Preserve test outcome
        if: steps.qa.outcome == 'failure'
        run: exit 1
