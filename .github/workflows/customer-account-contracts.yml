name: Customer account contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/components/dashboard/**'
      - 'frontend/src/components/account/AccountHubSheet.jsx'
      - 'frontend/src/api/accountWorkspace.js'
      - 'frontend/src/api/jobs.js'
      - 'frontend/src/styles/dashboard-experience.css'
      - 'drywalltoolbox/wp/wp-content/mu-plugins/dtb-platform/Rest/CustomerJobsController.php'
      - 'drywalltoolbox/wp/wp-content/mu-plugins/dtb-platform/bootstrap.php'
      - '.github/workflows/customer-account-contracts.yml'

permissions:
  contents: read

jobs:
  account-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validate customer notebook PHP syntax
        run: |
          php -l drywalltoolbox/wp/wp-content/mu-plugins/dtb-platform/Rest/CustomerJobsController.php
          php -l drywalltoolbox/wp/wp-content/mu-plugins/dtb-platform/bootstrap.php
