<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html[data-dtb-booting="true"] #root {
        opacity: 0;
        visibility: hidden;
        transition: opacity 240ms ease, visibility 0s linear 0s;
      }
      html[data-dtb-app-mounted="true"] #root {
        opacity: 1;
        visibility: visible;
      }
      html[data-dtb-app-mounted="true"] #root {
        transition: opacity 260ms ease-out;
      }
      #dtb-global-preloader {
        display: none;
      }
      html[data-dtb-booting="true"] #dtb-global-preloader,
      html[data-dtb-global-preloader="true"] #dtb-global-preloader {
        position: fixed;
        z-index: 2147483000;
        inset: 0;
        display: flex;
        flex-direction: column;
        overflow: auto;
        background: #f5f7fa;
        color: #101b2b;
        opacity: 1;
        visibility: visible;
        transition: opacity 260ms ease-out, visibility 0s linear 0s;
        font-family: Inter, Geist, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      html[data-dtb-app-mounted="true"] #dtb-global-preloader {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 260ms ease-out, visibility 0s linear 260ms;
      }
      html[data-dtb-app-mounted="true"][data-dtb-global-preloader="true"] #dtb-global-preloader {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transition: opacity 120ms ease-out, visibility 0s linear 0s;
      }
      .dtb-global-preloader__header {
        box-sizing: border-box;
        display: flex;
        width: 100%;
        height: 78px;
        flex: 0 0 78px;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
        padding: 0 max(28px, calc((100vw - 1240px) / 2));
        border-bottom: 1px solid #e6eaf0;
        background: #fff;
      }
      .dtb-global-preloader__brand {
        color: #101b2b;
        font-size: 16px;
        font-weight: 850;
        letter-spacing: -.045em;
        white-space: nowrap;
      }
      .dtb-global-preloader__brand span {
        display: block;
        margin-top: 2px;
        color: #78869a;
        font-size: 8px;
        font-weight: 750;
        letter-spacing: .16em;
      }
      .dtb-global-preloader__nav,
      .dtb-global-preloader__actions {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .dtb-global-preloader__nav i,
      .dtb-global-preloader__action,
      .dtb-global-preloader__line,
      .dtb-global-preloader__button,
      .dtb-global-preloader__category,
      .dtb-global-preloader__product {
        position: relative;
        overflow: hidden;
        background: linear-gradient(100deg, #e9edf2 25%, #f5f7fa 43%, #e9edf2 62%);
        background-size: 220% 100%;
        animation: dtb-global-preloader-shimmer 1.8s ease-in-out infinite;
      }
      .dtb-global-preloader__nav i {
        display: block;
        width: 62px;
        height: 8px;
        border-radius: 8px;
      }
      .dtb-global-preloader__action {
        width: 34px;
        height: 34px;
        border-radius: 50%;
      }
      .dtb-global-preloader__main {
        box-sizing: border-box;
        width: min(1240px, calc(100% - 56px));
        margin: 28px auto 56px;
      }
      .dtb-global-preloader__hero {
        position: relative;
        display: grid;
        min-height: 390px;
        grid-template-columns: minmax(0, 1fr) minmax(280px, .78fr);
        align-items: center;
        gap: 40px;
        overflow: hidden;
        padding: clamp(32px, 5.5vw, 72px);
        border: 1px solid rgba(255, 255, 255, .09);
        border-radius: 22px;
        background: linear-gradient(128deg, #0d192d 0%, #132743 56%, #1b3a65 100%);
        box-shadow: 0 22px 56px rgba(16, 27, 43, .13);
      }
      .dtb-global-preloader__copy,
      .dtb-global-preloader__art {
        position: relative;
        z-index: 1;
      }
      .dtb-global-preloader__eyebrow {
        display: inline-block;
        width: 176px;
        height: 8px;
        margin-bottom: 23px;
        border-radius: 8px;
        background: rgba(255, 255, 255, .25);
      }
      .dtb-global-preloader__line {
        display: block;
        height: 15px;
        margin: 12px 0;
        border-radius: 10px;
        background-image: linear-gradient(100deg, rgba(255,255,255,.14) 25%, rgba(255,255,255,.27) 43%, rgba(255,255,255,.14) 62%);
      }
      .dtb-global-preloader__line--title { width: min(100%, 430px); height: 34px; margin: 0 0 14px; }
      .dtb-global-preloader__line--title-short { width: min(78%, 330px); height: 34px; margin-top: 0; }
      .dtb-global-preloader__line--copy { width: min(95%, 480px); height: 9px; margin-top: 28px; }
      .dtb-global-preloader__line--copy-short { width: min(72%, 350px); height: 9px; }
      .dtb-global-preloader__cta-row { display: flex; gap: 12px; margin-top: 29px; }
      .dtb-global-preloader__button { width: 142px; height: 46px; border: 1px solid rgba(255,255,255,.14); border-radius: 9px; background: rgba(255,255,255,.16); }
      .dtb-global-preloader__button--secondary { width: 116px; background: rgba(255,255,255,.06); }
      .dtb-global-preloader__art {
        display: grid;
        min-height: 260px;
        place-items: center;
        border: 1px solid rgba(255,255,255,.13);
        border-radius: 18px;
        background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.015));
      }
      .dtb-global-preloader__art::before,
      .dtb-global-preloader__art::after {
        position: absolute;
        width: 210px;
        height: 210px;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 50%;
        content: "";
      }
      .dtb-global-preloader__art::after { width: 148px; height: 148px; }
      .dtb-global-preloader__tool {
        z-index: 1;
        width: 80px;
        height: 144px;
        border: 1px solid rgba(255,255,255,.28);
        border-radius: 18px;
        background: linear-gradient(150deg, rgba(255,255,255,.22), rgba(255,255,255,.05));
        box-shadow: 0 24px 44px rgba(0,0,0,.18);
        transform: rotate(13deg);
      }
      .dtb-global-preloader__categories { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; margin-top: 24px; }
      .dtb-global-preloader__category { height: 68px; border: 1px solid #e9edf2; border-radius: 12px; background-color: #fff; }
      .dtb-global-preloader__rail-head { display: flex; justify-content: space-between; gap: 20px; margin: 34px 0 16px; }
      .dtb-global-preloader__rail-head .dtb-global-preloader__line { width: 164px; height: 13px; margin: 0; }
      .dtb-global-preloader__rail-head .dtb-global-preloader__line:last-child { width: 76px; }
      .dtb-global-preloader__products { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
      .dtb-global-preloader__product { height: 188px; border: 1px solid #e9edf2; border-radius: 13px; background-color: #fff; }
      @keyframes dtb-global-preloader-shimmer { to { background-position-x: -220%; } }
      @media (max-width: 760px) {
        .dtb-global-preloader__header { height: 66px; flex-basis: 66px; padding-inline: 20px; }
        .dtb-global-preloader__nav { display: none; }
        .dtb-global-preloader__main { width: calc(100% - 32px); margin-top: 16px; }
        .dtb-global-preloader__hero { min-height: 340px; grid-template-columns: minmax(0,1fr); gap: 0; padding: 30px 24px; border-radius: 16px; }
        .dtb-global-preloader__art { display: none; }
        .dtb-global-preloader__line--title,.dtb-global-preloader__line--title-short { height: 26px; }
        .dtb-global-preloader__categories { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; margin-top: 14px; }
        .dtb-global-preloader__category { height: 52px; }
        .dtb-global-preloader__rail-head { margin-top: 26px; }
        .dtb-global-preloader__products { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
        .dtb-global-preloader__product { height: 154px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .dtb-global-preloader__nav i,.dtb-global-preloader__action,.dtb-global-preloader__line,.dtb-global-preloader__button,.dtb-global-preloader__category,.dtb-global-preloader__product { animation: none; }
        html[data-dtb-booting="true"] #root,html[data-dtb-app-mounted="true"] #root,#dtb-global-preloader,html[data-dtb-app-mounted="true"] #dtb-global-preloader { transition: none; }
      }
    </style>
    <script>document.documentElement.setAttribute('data-dtb-booting', 'true');</script>
    <!--
      Kill-switch for any service worker registered by a previous deploy.
      The app does not register a service worker; nothing here needs one.
      An orphaned service worker from an older build can persist on a
      returning visitor's device indefinitely and silently serve a frozen,
      possibly-broken cached shell on every future visit (network entirely
      bypassed) — the classic "works on desktop, blank on my phone" report
      from a phone that visited before. This runs unconditionally, on every
      load, before anything else, to guarantee that class of bug can never
      persist past a single page view.
    -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) { reg.unregister(); });
        }).catch(function () {});
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) {
            if (/^(workbox|dtb-)/.test(key)) caches.delete(key);
          });
        }).catch(function () {});
      }
      if (window.location.search && /(?:^|[?&])source=pwa(?:&|$)/.test(window.location.search)) {
        try {
          var pwaUrl = new URL(window.location.href);
          pwaUrl.searchParams.delete('source');
          window.history.replaceState(window.history.state, document.title, pwaUrl.pathname + pwaUrl.search + pwaUrl.hash);
        } catch (e) {}
      }
      (function () {
        var standaloneQuery = window.matchMedia ? window.matchMedia('(display-mode: standalone)') : null;
        function syncAppDisplayMode() {
          var standalone = (standaloneQuery && standaloneQuery.matches) || window.navigator.standalone === true;
          document.documentElement.setAttribute('data-dtb-display-mode', standalone ? 'standalone' : 'browser');
        }
        syncAppDisplayMode();
        if (standaloneQuery && standaloneQuery.addEventListener) {
          standaloneQuery.addEventListener('change', syncAppDisplayMode);
        }
      })();
    </script>

    <!-- One bounded recovery retry; failed boots keep the single shared branded preloader. -->
    <script>
      (function () {
        var RETRY_KEY = 'dtb:boot-retry';
        var recoveryScheduled = false;

        function appHasMounted() {
          return document.documentElement.getAttribute('data-dtb-app-mounted') === 'true';
        }

        function attemptRecovery() {
          if (appHasMounted() || recoveryScheduled) return;
          recoveryScheduled = true;

          var url = new URL(window.location.href);
          var alreadyRetried = url.searchParams.has('_boot');
          try {
            alreadyRetried = alreadyRetried || window.sessionStorage.getItem(RETRY_KEY) === '1';
          } catch (e) {}

          if (alreadyRetried) return;

          try { window.sessionStorage.setItem(RETRY_KEY, '1'); } catch (e) {}
          url.searchParams.set('_boot', Date.now().toString(36));
          window.location.replace(url.toString());
        }

        window.addEventListener('error', function (event) {
          if (event && event.target && event.target.tagName === 'SCRIPT') {
            window.setTimeout(attemptRecovery, 50);
          }
        }, true);

        window.setTimeout(attemptRecovery, 8000);

        window.addEventListener('load', function () {
          if (!appHasMounted()) return;
          try { window.sessionStorage.removeItem(RETRY_KEY); } catch (e) {}
          var url = new URL(window.location.href);
          if (!url.searchParams.has('_boot')) return;
          url.searchParams.delete('_boot');
          window.history.replaceState(null, '', url.pathname + url.search + url.hash);
        });
      })();
    </script>
