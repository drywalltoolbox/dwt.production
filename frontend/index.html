<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Kill-switch for any service worker registered by a previous deploy.
      The app does not register a service worker; nothing here needs one.
      An orphaned service worker from an older build can persist on a
      returning visitor's device indefinitely and silently serve a frozen,
      possibly-broken cached shell on every future visit (network entirely
      bypassed) — the classic "works on desktop, blank on my phone" report
      from a phone that visited before. This runs unconditionally, on every
      load, before anything else, to guarantee that class of bug can never
      persist past a single page view.
    -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) { reg.unregister(); });
        }).catch(function () {});
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) {
            if (/^(workbox|dtb-)/.test(key)) caches.delete(key);
          });
        }).catch(function () {});
      }
      if (window.location.search && /(?:^|[?&])source=pwa(?:&|$)/.test(window.location.search)) {
        try {
          var pwaUrl = new URL(window.location.href);
          pwaUrl.searchParams.delete('source');
          window.history.replaceState(window.history.state, document.title, pwaUrl.pathname + pwaUrl.search + pwaUrl.hash);
        } catch (e) {}
      }
      (function () {
        var standaloneQuery = window.matchMedia ? window.matchMedia('(display-mode: standalone)') : null;
        function syncAppDisplayMode() {
          var standalone = (standaloneQuery && standaloneQuery.matches) || window.navigator.standalone === true;
          document.documentElement.setAttribute('data-dtb-display-mode', standalone ? 'standalone' : 'browser');
        }
        syncAppDisplayMode();
        if (standaloneQuery && standaloneQuery.addEventListener) {
          standaloneQuery.addEventListener('change', syncAppDisplayMode);
        }
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="<%= htmlWebpackPlugin.options.publicPath %>favicon.ico?v=20261020" />
    <link rel="shortcut icon" type="image/x-icon" href="<%= htmlWebpackPlugin.options.publicPath %>favicon.ico?v=20261020" />
    <link rel="icon" type="image/png" sizes="16x16" href="<%= htmlWebpackPlugin.options.publicPath %>favicon-16x16.png?v=20261020" />
    <link rel="icon" type="image/png" sizes="32x32" href="<%= htmlWebpackPlugin.options.publicPath %>favicon-32x32.png?v=20261020" />
    <link rel="icon" type="image/png" sizes="48x48" href="<%= htmlWebpackPlugin.options.publicPath %>favicon-48x48.png?v=20261020" />
    <link rel="apple-touch-icon" sizes="180x180" href="<%= htmlWebpackPlugin.options.publicPath %>apple-touch-icon.png?v=20261101" />
    <link rel="manifest" href="<%= htmlWebpackPlugin.options.publicPath %>site.webmanifest" />
    <!--
      viewport-fit=cover: supports iPhone safe-area layout.
      Pinch zoom remains available for accessibility; CSS prevents input-focus
      zoom, body-level horizontal overflow, and broken mobile viewport geometry.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── Runtime SEO authority: SEOHead / react-helmet-async ── -->
    <title>Drywall Toolbox</title>
    <meta name="keywords" content="drywall tools, taping tools, finishing tools, construction equipment, TapeTech, Level5">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Drywall Toolbox">

    <!-- Early connection to the production API / WP backend -->
    <link rel="preconnect" href="<%= htmlWebpackPlugin.options.siteUrl %>" crossorigin>
    <!-- Barlow Semi Condensed is reserved for hero display headlines; all other type remains locally hosted Geist. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@1,700&amp;display=swap" rel="stylesheet">

    <!-- Static Organization JSON-LD (supplements per-page dynamic schemas) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Drywall Toolbox",
      "url": "<%= htmlWebpackPlugin.options.siteUrl %>/",
      "logo": "https://drywalltoolbox.com/logos/logo-black.svg",
      "description": "Professional drywall tools and equipment from top brands. Shop automatic taping tools, mud boxes, finishing tools, and more.",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "email": "info@drywalltoolbox.com",
        "availableLanguage": "English"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Boot watchdog. React's ErrorBoundary (main.jsx) only catches errors
      that happen AFTER the app bundle has loaded and started rendering.
      It cannot help if the entry script itself never loads or throws before
      mounting (blocked/failed request, a stale asset path, a mobile
      carrier/proxy interfering with the response) — that failure mode is a
      permanently blank white page with no error UI. This is a
      framework-independent fallback: it does not depend on the app bundle,
      any stylesheet, or any external asset, so it still renders even when
      everything else has failed.
    -->
    <script>
      (function () {
        var RETRY_KEY = 'dtb:boot-retry';
        var TIMEOUT_MS = 8000;

        function appHasMounted() {
          return document.documentElement.getAttribute('data-dtb-app-mounted') === 'true';
        }

        function showFallback() {
          if (appHasMounted()) return;
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<main style="--ink:#101b2b;--muted:#64748b;--blue:#2458e8;--line:#dbe3ee;box-sizing:border-box;' +
            'min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;background:#f4f6f8;' +
            'color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;' +
            'padding:clamp(22px,4vw,48px) clamp(20px,6vw,88px) max(18px,env(safe-area-inset-bottom));">' +
            '<header style="display:flex;align-items:center;gap:12px;font-size:13px;font-weight:750;letter-spacing:.015em;">' +
            '<span aria-hidden="true" style="display:grid;width:34px;height:34px;place-items:center;border-radius:10px;' +
            'background:#14243c;color:#fff;font-size:15px;font-weight:900;letter-spacing:-.08em;">DT</span>' +
            '<span>DRYWALL TOOLBOX</span></header>' +
            '<div style="display:grid;place-items:center;padding:48px 0 64px;">' +
            '<section role="alert" aria-labelledby="dtb-boot-fallback-title" style="box-sizing:border-box;width:min(100%,900px);' +
            'display:grid;grid-template-columns:minmax(0,1.05fr) minmax(280px,.95fr);overflow:hidden;border:1px solid var(--line);' +
            'border-radius:24px;background:#fff;box-shadow:0 24px 64px rgba(16,27,43,.08);">' +
            '<div style="display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:clamp(28px,5vw,64px);">' +
            '<span style="display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid #f2d5ad;border-radius:999px;' +
            'background:#fff8ed;color:#865213;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;">' +
            '<span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:#d78c2f;"></span>Store connection interrupted</span>' +
            '<h1 id="dtb-boot-fallback-title" style="max-width:12ch;margin:24px 0 0;color:var(--ink);' +
            'font-size:clamp(34px,5.5vw,58px);font-weight:780;line-height:.99;letter-spacing:-.055em;">We hit a snag.<br>Let’s get you back.</h1>' +
            '<p style="max-width:42ch;margin:18px 0 0;color:var(--muted);font-size:15px;line-height:1.7;">' +
            'The store didn’t finish loading. Your account and cart are safe. Try reconnecting, or open the storefront directly.</p>' +
            '<div style="display:flex;flex-wrap:wrap;gap:10px;width:100%;margin-top:30px;">' +
            '<button type="button" data-dtb-retry style="appearance:none;min-height:50px;padding:0 22px;border:1px solid #2458e8;' +
            'border-radius:10px;background:#2458e8;color:#fff;font:750 14px/1 inherit;cursor:pointer;box-shadow:0 7px 18px rgba(36,88,232,.2);">' +
            '<span data-dtb-retry-label>Reconnect to the store</span></button>' +
            '<a href="/" style="display:inline-flex;min-height:50px;align-items:center;justify-content:center;padding:0 20px;' +
            'border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:14px;font-weight:700;text-decoration:none;">Open homepage</a></div>' +
            '<p role="status" aria-live="polite" data-dtb-retry-status style="min-height:18px;margin:12px 0 0;color:var(--muted);font-size:12px;line-height:1.5;">' +
            'A retry won’t change your account or cart.</p></div>' +
            '<div aria-hidden="true" style="position:relative;display:grid;min-height:390px;place-items:center;overflow:hidden;' +
            'background:linear-gradient(145deg,#101c30 0%,#172c4c 56%,#2458e8 160%);">' +
            '<div style="position:absolute;width:360px;height:360px;border:1px solid rgba(255,255,255,.12);border-radius:50%;"></div>' +
            '<div style="position:absolute;width:260px;height:260px;border:1px solid rgba(255,255,255,.13);border-radius:50%;"></div>' +
            '<div style="position:relative;display:grid;width:142px;height:142px;place-items:center;border:1px solid rgba(255,255,255,.25);' +
            'border-radius:36px;background:rgba(255,255,255,.08);color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.18);transform:rotate(-7deg);">' +
            '<svg width="68" height="68" viewBox="0 0 68 68" fill="none"><path d="M16 23a23 23 0 0 1 39-5l4 5M59 13v10H49M52 45a23 23 0 0 1-39 5l-4-5M9 55V45h10" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
            '<span style="position:absolute;right:clamp(22px,4vw,48px);bottom:32px;color:rgba(255,255,255,.62);font-size:11px;font-weight:700;letter-spacing:.16em;">BACK ON THE JOB, SOON</span>' +
            '</div></section></div>' +
            '<footer style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;color:#718096;font-size:11px;line-height:1.5;">' +
            '<span>DRYWALL TOOLBOX <span style="padding:0 6px;color:#c3ccd7;">/</span> PROFESSIONAL TOOLS, READY WHEN YOU ARE</span>' +
            '<a href="mailto:info@drywalltoolbox.com" style="color:#53647a;font-weight:700;text-decoration:none;">Need help? Contact support</a></footer></main>';

          var retryButton = root.querySelector('[data-dtb-retry]');
          if (retryButton) retryButton.addEventListener('click', function () {
            var label = retryButton.querySelector('[data-dtb-retry-label]');
            var status = root.querySelector('[data-dtb-retry-status]');
            retryButton.disabled = true;
            retryButton.style.opacity = '.78';
            if (label) label.textContent = 'Reconnecting…';
            if (status) status.textContent = 'Refreshing the storefront connection…';
            try { window.sessionStorage.removeItem(RETRY_KEY); } catch (e) {}
            var retryUrl = new URL(window.location.href);
            retryUrl.searchParams.delete('_boot');
            retryUrl.searchParams.set('_boot', Date.now().toString(36));
            window.location.replace(retryUrl.toString());
          });
        }

        function attemptRecovery() {
          if (appHasMounted()) return;

          var alreadyRetried = false;
          try {
            alreadyRetried = window.sessionStorage.getItem(RETRY_KEY) === '1';
          } catch (e) {}

          if (!alreadyRetried) {
            try { window.sessionStorage.setItem(RETRY_KEY, '1'); } catch (e) {}
            var url = new URL(window.location.href);
            url.searchParams.set('_boot', Date.now().toString(36));
            window.location.replace(url.toString());
            return;
          }

          showFallback();
        }

        // Entry-bundle load failures fire a synchronous window "error" event
        // for the offending <script> tag; catch it immediately instead of
        // waiting out the full timeout.
        window.addEventListener('error', function (event) {
          if (event && event.target && event.target.tagName === 'SCRIPT') {
            window.setTimeout(attemptRecovery, 50);
          }
        }, true);

        window.setTimeout(attemptRecovery, TIMEOUT_MS);

        window.addEventListener('load', function () {
          if (appHasMounted()) {
            try { window.sessionStorage.removeItem(RETRY_KEY); } catch (e) {}
          }
        });
      })();
    </script>
  </body>
</html>
