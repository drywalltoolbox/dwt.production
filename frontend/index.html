<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Kill-switch for any service worker registered by a previous deploy.
      The app does not register a service worker; nothing here needs one.
      An orphaned service worker from an older build can persist on a
      returning visitor's device indefinitely and silently serve a frozen,
      possibly-broken cached shell on every future visit (network entirely
      bypassed) — the classic "works on desktop, blank on my phone" report
      from a phone that visited before. This runs unconditionally, on every
      load, before anything else, to guarantee that class of bug can never
      persist past a single page view.
    -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) { reg.unregister(); });
        }).catch(function () {});
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) {
            if (/^(workbox|dtb-)/.test(key)) caches.delete(key);
          });
        }).catch(function () {});
      }
      if (window.location.search && /(?:^|[?&])source=pwa(?:&|$)/.test(window.location.search)) {
        try {
          var pwaUrl = new URL(window.location.href);
          pwaUrl.searchParams.delete('source');
          window.history.replaceState(window.history.state, document.title, pwaUrl.pathname + pwaUrl.search + pwaUrl.hash);
        } catch (e) {}
      }
      document.documentElement.classList.remove('dtb-document-transition-active');
      document.documentElement.classList.remove('dtb-checkout-handoff-active');
      (function () {
        var standaloneQuery = window.matchMedia ? window.matchMedia('(display-mode: standalone)') : null;
        function syncAppDisplayMode() {
          var standalone = (standaloneQuery && standaloneQuery.matches) || window.navigator.standalone === true;
          document.documentElement.setAttribute('data-dtb-display-mode', standalone ? 'standalone' : 'browser');
        }
        syncAppDisplayMode();
        if (standaloneQuery && standaloneQuery.addEventListener) {
          standaloneQuery.addEventListener('change', syncAppDisplayMode);
        }
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="<%= htmlWebpackPlugin.options.publicPath %>favicon.ico?v=20261020" />
    <link rel="shortcut icon" type="image/x-icon" href="<%= htmlWebpackPlugin.options.publicPath %>favicon.ico?v=20261020" />
    <link rel="icon" type="image/png" sizes="16x16" href="<%= htmlWebpackPlugin.options.publicPath %>favicon-16x16.png?v=20261020" />
    <link rel="icon" type="image/png" sizes="32x32" href="<%= htmlWebpackPlugin.options.publicPath %>favicon-32x32.png?v=20261020" />
    <link rel="icon" type="image/png" sizes="48x48" href="<%= htmlWebpackPlugin.options.publicPath %>favicon-48x48.png?v=20261020" />
    <link rel="apple-touch-icon" sizes="180x180" href="<%= htmlWebpackPlugin.options.publicPath %>apple-touch-icon.png?v=20261020" />
    <link rel="manifest" href="<%= htmlWebpackPlugin.options.publicPath %>site.webmanifest" />
    <!--
      viewport-fit=cover: supports iPhone safe-area layout.
      Pinch zoom remains available for accessibility; CSS prevents input-focus
      zoom, body-level horizontal overflow, and broken mobile viewport geometry.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── Runtime SEO authority: SEOHead / react-helmet-async ── -->
    <title>Drywall Toolbox</title>
    <meta name="keywords" content="drywall tools, taping tools, finishing tools, construction equipment, TapeTech, Level5">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Drywall Toolbox">

    <!--
      Initial document continuity surface. It exists before React/CSS bundles
      execute, then yields only after React has committed across two animation
      frames. Checkout has its own dedicated handoff and suppresses this shell.
    -->
    <style>
      #dtb-app-boot-shell{position:fixed;z-index:2147482000;inset:0;display:grid;place-items:center;min-height:100svh;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 44%,#102b50 0%,#0b1c35 38%,#061225 76%);color:#fff;opacity:1;transform:scale(1);transition:opacity 280ms cubic-bezier(.22,1,.36,1),transform 420ms cubic-bezier(.16,1,.3,1)}
      #dtb-app-boot-shell::before{position:absolute;z-index:-1;inset:-20%;content:"";background:radial-gradient(ellipse at 50% 48%,rgba(39,112,255,.2),transparent 42%),radial-gradient(ellipse at 50% 100%,rgba(12,67,151,.16),transparent 50%);pointer-events:none}
      #dtb-app-boot-shell__content{display:flex;width:min(100% - 2rem,28rem);flex-direction:column;align-items:center;gap:22px;text-align:center;transition:opacity 240ms ease,transform 320ms cubic-bezier(.22,1,.36,1)}
      #dtb-app-boot-shell__logo{display:block;width:clamp(168px,24vw,248px);height:auto;max-height:82px;object-fit:contain;filter:drop-shadow(0 12px 28px rgba(0,0,0,.28));animation:dtb-boot-logo-enter 540ms cubic-bezier(.16,1,.3,1) both}
      #dtb-app-boot-shell__signal{position:relative;display:block;width:clamp(112px,18vw,148px);height:3px;overflow:hidden;border-radius:999px;background:rgba(187,211,247,.18)}
      #dtb-app-boot-shell__signal::after{position:absolute;inset:0 auto 0 -42%;width:42%;border-radius:inherit;background:linear-gradient(90deg,transparent,#66a6ff,transparent);content:"";animation:dtb-boot-signal 1.45s ease-in-out infinite}
      #dtb-app-boot-shell__label{margin:0;color:#9db2d1;font:700 11px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.18em;text-transform:uppercase}
      html[data-dtb-app-mounted="true"] #dtb-app-boot-shell{opacity:0;transform:scale(1.012);pointer-events:none}
      html[data-dtb-app-mounted="true"] #dtb-app-boot-shell__content{opacity:0;transform:translateY(-12px)}
      html.dtb-checkout-route-booting #dtb-app-boot-shell{display:none}
      @keyframes dtb-boot-logo-enter{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
      @keyframes dtb-boot-signal{0%{transform:translateX(0)}100%{transform:translateX(345%)}}
      @media (prefers-reduced-motion:reduce){#dtb-app-boot-shell,#dtb-app-boot-shell__content{transition-duration:1ms}#dtb-app-boot-shell__logo,#dtb-app-boot-shell__signal::after{animation:none}}
      #dtb-checkout-route-loader{position:fixed;z-index:2147483000;inset:0;display:none;min-height:100vh;background:#f8fafc;color:#0f172a;align-items:center;justify-content:center}
      html.dtb-checkout-route-booting #dtb-checkout-route-loader{display:flex}
      .dtb-checkout-route-loader__content{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
      .dtb-secure-checkout-spinner{display:block;width:3.25em;height:3.25em;transform-origin:center;animation:dtb-secure-checkout-rotate 2s linear infinite}
      .dtb-secure-checkout-spinner__circle{fill:none;stroke:hsl(214,97%,59%);stroke-width:2;stroke-dasharray:1,200;stroke-dashoffset:0;stroke-linecap:round;animation:dtb-secure-checkout-dash 1.5s ease-in-out infinite}
      .dtb-checkout-route-loader__content p{margin:0;color:#475569;font:700 14px/1.5 "Nunito",ui-sans-serif,system-ui,sans-serif}
      @keyframes dtb-secure-checkout-rotate{100%{transform:rotate(360deg)}}
      @keyframes dtb-secure-checkout-dash{0%{stroke-dasharray:1,200;stroke-dashoffset:0}50%{stroke-dasharray:90,200;stroke-dashoffset:-35px}100%{stroke-dashoffset:-125px}}
      @media (prefers-reduced-motion:reduce){.dtb-secure-checkout-spinner,.dtb-secure-checkout-spinner__circle{animation:none}.dtb-secure-checkout-spinner__circle{stroke-dasharray:90,200;stroke-dashoffset:-35px}}
    </style>
    <script>
      if (/\/checkout\/?$/.test(window.location.pathname)) {
        document.documentElement.classList.add('dtb-checkout-route-booting');
        window.setTimeout(function () {
          document.documentElement.classList.remove('dtb-checkout-route-booting');
        }, 8000);
      }
    </script>

    <!-- Early connection to the production API / WP backend -->
    <link rel="preconnect" href="<%= htmlWebpackPlugin.options.siteUrl %>" crossorigin>
    <!-- Geist is self-hosted via @fontsource-variable/geist (see main.jsx) — no external font requests. -->

    <!-- Static Organization JSON-LD (supplements per-page dynamic schemas) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Drywall Toolbox",
      "url": "<%= htmlWebpackPlugin.options.siteUrl %>/",
      "logo": "https://drywalltoolbox.com/logos/logo-black.svg",
      "description": "Professional drywall tools and equipment from top brands. Shop automatic taping tools, mud boxes, finishing tools, and more.",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "email": "info@drywalltoolbox.com",
        "availableLanguage": "English"
      }
    }
    </script>
  </head>
  <body>
    <div id="dtb-app-boot-shell" aria-hidden="true">
      <div id="dtb-app-boot-shell__content">
        <img id="dtb-app-boot-shell__logo" src="https://drywalltoolbox.com/logos/logo-white.svg" alt="" width="440" height="120" />
        <span id="dtb-app-boot-shell__signal"></span>
        <p id="dtb-app-boot-shell__label">Preparing Drywall Toolbox</p>
      </div>
    </div>
    <div id="dtb-checkout-route-loader" aria-live="polite" role="status">
      <div class="dtb-checkout-route-loader__content">
        <svg class="dtb-secure-checkout-spinner" viewBox="25 25 50 50" aria-hidden="true" focusable="false">
          <circle class="dtb-secure-checkout-spinner__circle" r="20" cy="50" cx="50"></circle>
        </svg>
        <p>Preparing your secure checkout…</p>
      </div>
    </div>
    <div id="root"></div>

    <!--
      Boot watchdog. React's ErrorBoundary (main.jsx) only catches errors
      that happen AFTER the app bundle has loaded and started rendering.
      It cannot help if the entry script itself never loads or throws before
      mounting (blocked/failed request, a stale asset path, a mobile
      carrier/proxy interfering with the response) — that failure mode is a
      permanently blank white page with no error UI. This is a
      framework-independent fallback: it does not depend on the app bundle,
      any stylesheet, or any external asset, so it still renders even when
      everything else has failed.
    -->
    <script>
      (function () {
        var RETRY_KEY = 'dtb:boot-retry';
        var TIMEOUT_MS = 8000;

        function appHasMounted() {
          return document.documentElement.getAttribute('data-dtb-app-mounted') === 'true';
        }

        function showFallback() {
          if (appHasMounted()) return;
          var bootShell = document.getElementById('dtb-app-boot-shell');
          if (bootShell) bootShell.remove();
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<main style="box-sizing:border-box;min-height:100svh;display:grid;place-items:center;' +
            'background:radial-gradient(circle at 50% 42%,#ffffff 0,#f8fbff 46%,#eef4fb 100%);' +
            'color:#071a38;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;padding:32px 20px;">' +
            '<section role="alert" aria-labelledby="dtb-boot-fallback-title" style="box-sizing:border-box;width:min(100%,460px);' +
            'padding:42px 38px 36px;border:1px solid rgba(174,195,222,.7);border-radius:18px;background:rgba(255,255,255,.94);' +
            'box-shadow:0 24px 70px rgba(7,26,56,.11);text-align:center;">' +
            '<img src="https://drywalltoolbox.com/logos/logo-black.svg" alt="Drywall Toolbox" width="220" height="60" ' +
            'style="display:block;width:min(220px,72%);height:auto;margin:0 auto 30px;object-fit:contain;">' +
            '<div aria-hidden="true" style="width:42px;height:3px;margin:0 auto 22px;border-radius:999px;background:#0878ff;"></div>' +
            '<h1 id="dtb-boot-fallback-title" style="margin:0;color:#071a38;font-size:clamp(22px,5vw,28px);font-weight:800;' +
            'line-height:1.12;letter-spacing:-.035em;">We’re having trouble loading the store</h1>' +
            '<p style="max-width:34ch;margin:14px auto 0;color:#587092;font-size:15px;font-weight:450;line-height:1.6;">' +
            'The storefront did not finish loading. Your browser can retry the connection without changing your account or cart.</p>' +
            '<button type="button" onclick="location.reload()" style="appearance:none;width:100%;min-height:48px;margin-top:28px;' +
            'border:1px solid #0878ff;border-radius:10px;background:#0878ff;color:#fff;font:700 15px/1 system-ui,-apple-system,sans-serif;' +
            'box-shadow:0 8px 20px rgba(8,120,255,.18);cursor:pointer;">Try again</button>' +
            '<p style="margin:18px 0 0;color:#7b8da8;font-size:12px;line-height:1.5;">If the problem continues, check your connection and try again.</p>' +
            '</section></main>';
        }

        function attemptRecovery() {
          if (appHasMounted()) return;

          var alreadyRetried = false;
          try {
            alreadyRetried = window.sessionStorage.getItem(RETRY_KEY) === '1';
          } catch (e) {}

          if (!alreadyRetried) {
            try { window.sessionStorage.setItem(RETRY_KEY, '1'); } catch (e) {}
            var url = new URL(window.location.href);
            url.searchParams.set('_boot', Date.now().toString(36));
            window.location.replace(url.toString());
            return;
          }

          showFallback();
        }

        // Entry-bundle load failures fire a synchronous window "error" event
        // for the offending <script> tag; catch it immediately instead of
        // waiting out the full timeout.
        window.addEventListener('error', function (event) {
          if (event && event.target && event.target.tagName === 'SCRIPT') {
            window.setTimeout(attemptRecovery, 50);
          }
        }, true);

        window.setTimeout(attemptRecovery, TIMEOUT_MS);

        window.addEventListener('load', function () {
          if (appHasMounted()) {
            try { window.sessionStorage.removeItem(RETRY_KEY); } catch (e) {}
          }
        });
      })();
    </script>
  </body>
</html>
